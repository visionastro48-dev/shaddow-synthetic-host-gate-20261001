# Disposable real-model code-generation trial; never checks out ANGELS private source.
# Only synthetic no-authority files are tested, and no API keys are injected.
name: ANGELS FORGE Real Local Coding Gate
on:
  push:
    branches: [main]
    paths:
      - 'angels-recovery/forge-real-model-coding.py'
      - '.github/workflows/angels-forge-real-local-coding.yml'
  schedule:
    # Synthetic, zero-authority acceptance on standard public-repo runners.
    # Hourly at :47 UTC; best-effort GitHub scheduling, NOT a 24/7 worker.
    # This never enrolls with or receives production authority from ANGELS.
    - cron: '47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: angels-forge-real-local-coding
  cancel-in-progress: false
jobs:
  real-llm-coding:
    if: github.repository == 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare disposable localhost Ollama inference
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
          test -z "${ANGELS_MODULE_TOKEN:-}"
          docker run -d --rm --name angels-forge-ollama -p 127.0.0.1:11434:11434 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_CONTEXT_LENGTH=8192 \
            ollama/ollama:0.11.10 > /dev/null
          for i in $(seq 1 40); do
            curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          timeout 500 docker exec angels-forge-ollama ollama pull qwen3:4b-instruct > /dev/null
          echo 'LOCAL_MODEL_INSTALLED_AND_ENDPOINT_READY'
      - name: Real model writes code through structured tool; independent tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile angels-recovery/forge-real-model-coding.py
          timeout 900 python3 angels-recovery/forge-real-model-coding.py
      - name: Preserve independently verified synthetic source and receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, pinned
        with:
          name: angels-forge-accepted
          path: forge-accepted-output/
          if-no-files-found: error
          retention-days: 7
      - name: Dispose local model and runtime
        if: always()
        run: docker rm -f angels-forge-ollama >/dev/null 2>&1 || true

  # Separate short-lived identity: model process never receives write credentials.
  # Only after the unprivileged model job passes may this job verify and commit DATA.
  receipt-publisher:
    needs: real-llm-coding
    if: ${{ needs.real-llm-coding.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - name: Checkout trusted synthetic repository (no production material)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Download accepted model output AS DATA, never execute model source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0, pinned
        with:
          name: angels-forge-accepted
          path: forge-received
      - name: Regression-test durable publisher on synthetic fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s angels-recovery -p 'test_forge_evidence_publish.py' -v
      - name: Validate artifact and prepare immutable, idempotent evidence files
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
          python3 angels-recovery/forge-evidence-publish.py \
            --artifact "$GITHUB_WORKSPACE/forge-received" --repo "$GITHUB_WORKSPACE" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --event "$GITHUB_EVENT_NAME" --sha "$GITHUB_SHA"
      - name: Persist bounded synthetic receipt and source without token exposure to model
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'angels-forge-evidence'
          git config user.email 'angels-forge-evidence@users.noreply.github.com'
          git add "angels-recovery/evidence/forge-runs/forge-${GITHUB_RUN_ID}/gate_verify.py" \
                  "angels-recovery/evidence/forge-runs/forge-${GITHUB_RUN_ID}/receipt.json"
          if git diff --cached --quiet; then
            echo 'FORGE_DURABLE_GIT_RECEIPT=IDEMPOTENT_EXISTING'
            exit 0
          fi
          git commit -m "Preserve verified synthetic FORGE run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "FORGE_DURABLE_GIT_RECEIPT=PERSISTED run_id=${GITHUB_RUN_ID} commit=$(git rev-parse HEAD)"
              exit 0
            fi
            sleep "$((attempt * 3))"
          done
          echo 'FORGE_DURABLE_GIT_RECEIPT=FAILED_NO_FORCE_PUSH' >&2
          exit 1
