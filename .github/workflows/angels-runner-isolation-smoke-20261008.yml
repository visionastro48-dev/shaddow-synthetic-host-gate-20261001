name: ANGELS Runner Isolation Smoke (No Authority)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/angels-runner-isolation-smoke-20261008.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Prove GitHub-hosted runner allocation without application dependencies
        run: |
          echo "ANGELS_RUNNER_ALLOCATED=true"
          echo "No secrets, mission execution, infrastructure mutation, or external effects."
