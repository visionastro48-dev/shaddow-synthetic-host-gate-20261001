# One-shot, synthetic Hermes Agent verification. Public runner, no ANGELS secrets or authority.
# No scheduled repeat and no deployments. All computation remains on disposable runner.
name: ANGELS Hermes Real Handoff Module Build
on:
  push:
    branches: [lab/hermes-real-module-20261009]
    paths: [.github/workflows/angels-hermes-real-free-smoke.yml]
permissions: {}
concurrency:
  group: angels-hermes-real-module
  cancel-in-progress: false

jobs:
  real-hermes-free-inference:
    if: github.repository == 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Assert no company source and no production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "visionastro48-dev/shaddow-synthetic-host-gate-20261001"
          test ! -e .git
          test ! -e "$HOME/.hermes"
          test ! -e /srv/angels-foundation-v1
          echo 'ISOLATED_STANDARD_PUBLIC_RUNNER=true'
          echo 'PRODUCTION_AUTHORITY=false'
          echo 'GITHUB_REPOSITORY_SOURCE_CHECKED_OUT=false'

      - name: Install upstream Hermes in disposable runner home
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          export HOME="$RUNNER_TEMP/hermes-user"
          export HERMES_HOME="$HOME/.hermes"
          mkdir -p "$HOME"
          curl -fsSL --retry 2 --connect-timeout 15 https://hermes-agent.nousresearch.com/install.sh -o "$RUNNER_TEMP/hermes-install.sh"
          bash "$RUNNER_TEMP/hermes-install.sh" --non-interactive --skip-browser --skip-computer-use --hermes-home "$HERMES_HOME" --dir "$HERMES_HOME/hermes-agent"
          export PATH="$HOME/.local/bin:$HERMES_HOME/bin:$PATH"
          command -v hermes || test -x "$HERMES_HOME/bin/hermes"
          echo 'OFFICIAL_HERMES_INSTALLED_IN_DISPOSABLE_HOME=true'
          echo "HERMES_HOME=$HERMES_HOME" >> "$GITHUB_ENV"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HERMES_HOME/bin" >> "$GITHUB_PATH"

      - name: Hermes implements ANGELS handoff module and independent tests
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$HERMES_HOME/bin:$PATH"
          hermes --help >/dev/null
          # Temporary loopback relay: Kilo accepts the verified free model without a token,
          # but Hermes sends a placeholder Authorization header that Kilo rejects.
          curl -fsSL --retry 2 --connect-timeout 10 \
            https://raw.githubusercontent.com/visionastro48-dev/shaddow-synthetic-host-gate-20261001/54c5f675a924b5a6229b82f72d0c87bb7bd6a352/angels-recovery/hermes-free-noauth-proxy.py \
            -o "$RUNNER_TEMP/hermes-free-proxy.py"
          python3 -u "$RUNNER_TEMP/hermes-free-proxy.py" > "$RUNNER_TEMP/hermes-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 1 http://127.0.0.1:8765/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          echo 'CREDENTIALLESS_FREE_PROXY_LISTENING_LOCALHOST=true'
          mkdir -p "$HERMES_HOME" "$RUNNER_TEMP/hermes-workspace"
          chmod 700 "$HERMES_HOME"
          printf '%s\n'             'model:'             '  default: "nvidia/nemotron-3.5-lightning:free"'             '  provider: custom'             '  base_url: "http://127.0.0.1:8765/v1"'             '  api_key: ""'             'fallback_providers: []'             'terminal:'             '  backend: local'             > "$HERMES_HOME/config.yaml"
          chmod 600 "$HERMES_HOME/config.yaml"
          cat > "$RUNNER_TEMP/hermes-workspace/hermes-handoff.test.mjs" <<'NODE'
          import test from "node:test";
          import assert from "node:assert/strict";
          import { inspectHermesHandoff } from "./hermes-handoff.mjs";
          
          const h = "a".repeat(64), alt = "b".repeat(64);
          const receipt = () => ({
            mission_id:"angels_adapter_v1", mission_sha256:h,
            status:"UNVERIFIED_WORKER_OUTPUT", gateway_joined:false,
            authority_granted:false, independently_verified:false
          });
          const proof = () => ({
            missionId:"angels_adapter_v1", missionSha256:h,
            expectedArtifactSha256:alt, observedArtifactSha256:alt
          });
          test("A real matching artifact produces ONLY bounded hash verdict", () => {
            const x = inspectHermesHandoff(receipt(), proof());
            assert.deepEqual(x, {verdict:"ARTIFACT_HASH_MATCH_ONLY"});
          });
          test("No receipt fails closed", () => {
            assert.equal(inspectHermesHandoff(null,proof()).verdict,"REJECTED");
          });
          test("No external artifact witness fails closed", () => {
            assert.equal(inspectHermesHandoff(receipt(),null).verdict,"REJECTED");
          });
          test("Wrong mission identifier fails closed", () => {
            const r=receipt(); r.mission_id="other_job";
            assert.equal(inspectHermesHandoff(r,proof()).verdict,"REJECTED");
          });
          test("Wrong mission digest fails closed", () => {
            const r=receipt(); r.mission_sha256=alt;
            assert.equal(inspectHermesHandoff(r,proof()).verdict,"REJECTED");
          });
          test("Wrong artifact digest fails closed", () => {
            const p=proof(); p.observedArtifactSha256=h;
            assert.equal(inspectHermesHandoff(receipt(),p).verdict,"REJECTED");
          });
          test("Missing or malformed hash fails closed", () => {
            const p=proof(); p.expectedArtifactSha256="not-a-digest";
            assert.equal(inspectHermesHandoff(receipt(),p).verdict,"REJECTED");
          });
          test("Failed worker output is never promoted", () => {
            const r=receipt(); r.status="FAILED";
            assert.equal(inspectHermesHandoff(r,proof()).verdict,"REJECTED");
          });
          test("Self-declared gateway enrollment is not proof", () => {
            const r=receipt(); r.gateway_joined=true;
            assert.equal(inspectHermesHandoff(r,proof()).verdict,"REJECTED");
          });
          test("Self-declared independent verification is not proof", () => {
            const r=receipt(); r.independently_verified=true;
            assert.equal(inspectHermesHandoff(r,proof()).verdict,"REJECTED");
          });
          test("Production authority claim is rejected", () => {
            const r=receipt(); r.authority_granted=true;
            assert.equal(inspectHermesHandoff(r,proof()).verdict,"REJECTED");
          });
          NODE
          cd "$RUNNER_TEMP/hermes-workspace"
          sha256sum hermes-handoff.test.mjs > "$RUNNER_TEMP/tests.sha256"
          printf '%s\n' \
            'You are implementing a REAL reusable ANGELS Hermes Agent integration helper, not a demo hello-file.' \
            'Only create the file hermes-handoff.mjs in the current isolated working directory. Do not modify hermes-handoff.test.mjs. No network, production, or company authority.' \
            'Export a function named inspectHermesHandoff(receipt, proof) from hermes-handoff.mjs. It must return EXACTLY {verdict:'\''ARTIFACT_HASH_MATCH_ONLY'\''} if and only if:' \
            'receipt and proof are non-array objects; receipt.status is UNVERIFIED_WORKER_OUTPUT; receipt.gateway_joined, receipt.authority_granted and receipt.independently_verified are all strictly false; receipt.mission_id equals proof.missionId (nonempty string); receipt.mission_sha256 equals proof.missionSha256, valid 64-char lowercase hex; proof.expectedArtifactSha256 and proof.observedArtifactSha256 are equal valid 64-char lowercase hex strings.' \
            'For every other case return exactly {verdict:'\''REJECTED'\''}. Never output DONE, VERIFIED, AUTHORIZED, or claim an internal ANGELS worker acknowledged anything.' \
            'Use the terminal tools to write real JavaScript code, then run node --test hermes-handoff.test.mjs. Fix code and rerun tests until all pass. The tests are a protected independent acceptance suite.' \
            'Your response is irrelevant unless the actual file exists and all acceptance tests pass. Complete only this bounded module.' > "$RUNNER_TEMP/hermes-task.txt"
          set +e
          timeout 170 hermes chat --oneshot --quiet --toolsets "terminal,file" --max-turns 10 --provider custom --model "nvidia/nemotron-3.5-lightning:free" --query-file "$RUNNER_TEMP/hermes-task.txt" > "$RUNNER_TEMP/hermes-log.txt" 2>&1
          result=$?
          set -e
          echo "HERMES_EXIT_STATUS=$result"
          sed -n '1,110p' "$RUNNER_TEMP/hermes-log.txt"
          echo 'HERMES_PROXY_RECEIPTS_BEGIN'
          sed -n '1,120p' "$RUNNER_TEMP/hermes-proxy.log"
          echo 'HERMES_PROXY_RECEIPTS_END'
          test "$result" -eq 0
          grep -q '"event": "FREE_INFERENCE_RECEIPT"' "$RUNNER_TEMP/hermes-proxy.log"
          test -s hermes-handoff.mjs
          sha256sum -c "$RUNNER_TEMP/tests.sha256"
          echo 'HERMES_CODE_FILE_BEGIN'
          sed -n '1,180p' hermes-handoff.mjs
          echo 'HERMES_CODE_FILE_END'
          node --test hermes-handoff.test.mjs
          sha256sum hermes-handoff.mjs
          echo 'REAL_HERMES_HANDOFF_MODULE_VERIFIED=true'
          echo 'NO_ANGELS_GATEWAY_ENROLLMENT=true'

      - name: Archive Hermes code and independent tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angels-hermes-real-integration-module
          path: |
            ${{ runner.temp }}/hermes-workspace/hermes-handoff.mjs
            ${{ runner.temp }}/hermes-workspace/hermes-handoff.test.mjs
          if-no-files-found: warn
          retention-days: 7

      - name: Retain truth boundary
        if: always()
        shell: bash
        run: |
          echo 'ONE_SHOT_PUBLIC_RUNNER_ONLY=true'
          echo 'CONTINUOUS_24X7=false'
          echo 'ANGELS_PRODUCTION_AUTHORITY=false'
          echo 'PERMANENT_HERMES_INSTALL=false'
