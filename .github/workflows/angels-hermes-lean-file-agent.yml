# Actual Hermes Agent on disposable public cloud runner. No AWS authorization, secrets, or private code.
name: ANGELS Hermes Lean File Agent 64K
on:
  push:
    branches: [main]
    paths: ['.github/workflows/angels-hermes-lean-file-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: angels-hermes-lean-file-agent
  cancel-in-progress: false
jobs:
  real-hermes-smoke:
    if: github.repository == 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CI: 'true'
      HERMES_STREAM_READ_TIMEOUT: '300'
    steps:
      - name: Verify bounded public runner identity
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
          test -z "${AWS_ACCESS_KEY_ID:-}"
          test -z "${AWS_SECRET_ACCESS_KEY:-}"
          test -z "${OPENROUTER_API_KEY:-}"
          test -z "${OPENAI_API_KEY:-}"
          echo 'PUBLIC_RUNNER_NO_PRODUCTION_CREDENTIALS=PASS'
      - name: Start disposable free Ollama inference locally
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run -d --rm --name angels-hermes-ollama -p 127.0.0.1:11434:11434 \
            -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_CONTEXT_LENGTH=65536 \
            -e OLLAMA_FLASH_ATTENTION=1 -e OLLAMA_KV_CACHE_TYPE=q8_0 \
            ollama/ollama:0.11.10 >/dev/null
          for i in $(seq 1 50); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          docker exec angels-hermes-ollama ollama --version
          timeout 440 docker exec angels-hermes-ollama ollama pull qwen3:4b-instruct >/dev/null
          printf 'FROM qwen3:4b-instruct\nPARAMETER num_ctx 65536\nPARAMETER num_predict 256\nPARAMETER temperature 0.0\n' > /tmp/angels-Modelfile
          docker cp /tmp/angels-Modelfile angels-hermes-ollama:/tmp/angels-Modelfile
          timeout 180 docker exec angels-hermes-ollama ollama create angels-lean-qwen64k -f /tmp/angels-Modelfile >/dev/null
          curl -fsS http://127.0.0.1:11434/api/tags | python3 -c 'import json,sys; d=json.load(sys.stdin); assert any(x.get("name","").startswith("angels-lean-qwen64k") for x in d["models"])'
          echo 'LOCAL_HERMES3_MODEL_READY=YES'
      - name: Prove native IBM Granite inference before invoking Hermes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p hermes-cloud-evidence
          timeout 240 python3 - <<'PY'
          import json,urllib.request,time,hashlib,pathlib
          reqbody=json.dumps({'model':'angels-lean-qwen64k','messages':[{'role':'user','content':'What is 19 plus 24? Reply with only the integer.'}],
              'stream':False,'keep_alive':'12m','options':{'num_ctx':65536,'num_predict':64,'temperature':0}}).encode()
          start=time.monotonic()
          req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=reqbody,
              headers={'Content-Type':'application/json'})
          resp=json.load(urllib.request.urlopen(req,timeout=235))
          answer=(resp.get('message') or {}).get('content','').strip()
          ok=answer.rstrip('.')=='43'
          pathlib.Path('hermes-cloud-evidence/native-check.json').write_text(json.dumps({
              'native_answer_verified':ok,'hermes_answer_verified':False,
              'elapsed_seconds':round(time.monotonic()-start,2),
              'answer_sha256':hashlib.sha256(answer.encode()).hexdigest(),
              'answer_preview':answer[:250],
              'message_fields':sorted(list((resp.get('message') or {}).keys()))},indent=2))
          if not ok:
              print('NATIVE_HERMES3_MATH_CHECK=FAILED_DIAGNOSTIC_NOT_CERTIFIED')
          else:
              print('NATIVE_HERMES3_MATH_CHECK=PASS')
          PY
      - name: Install original Nous Hermes in an isolated no-secrets environment
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL --max-time 30 https://hermes-agent.nousresearch.com/install.sh -o /tmp/hermes-official-install.sh
          timeout 700 bash /tmp/hermes-official-install.sh --non-interactive --skip-browser --skip-computer-use
          test -x "$HOME/.local/bin/hermes"
          "$HOME/.local/bin/hermes" --version
          echo 'REAL_HERMES_CLI_INSTALLED=YES'
      - name: Execute REAL minimal Hermes file agent and independently validate generated source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.hermes" lean-workspace lean-evidence
          test -x "$HOME/.local/bin/hermes-agent"
          "$HOME/.local/bin/hermes-agent" --help > lean-evidence/help.txt
          grep -q -- '--enabled-toolsets' lean-evidence/help.txt
          grep -q -- '--base-url' lean-evidence/help.txt
          cat > "$HOME/.hermes/config.yaml" <<'CONFIG'
          model:
            default: angels-lean-qwen64k
            provider: custom
            base_url: http://127.0.0.1:11434/v1
            context_length: 65536
            max_tokens: 256
          toolsets: [file]
          agent:
            reasoning_effort: low
            max_turns: 3
            disabled_toolsets: [browser, web, memory, skills, delegation, cronjob, code_execution, vision, session_search]
          skills:
            auto_load: []
          memory:
            memory_enabled: false
          CONFIG
          "$HOME/.local/bin/hermes" prompt-size --json > lean-evidence/prompt-size.json
          cd lean-workspace
          set +e
          timeout 430 "$HOME/.local/bin/hermes-agent" \
            --query "Use the file tool to create calc_gate.py in this directory. The entire file must contain only def add(a,b): return a+b. Do not run commands, use the web, or edit other files." \
            --base-url http://127.0.0.1:11434/v1 --model angels-lean-qwen64k \
            --enabled-toolsets file --max-turns 3 > ../lean-evidence/agent-transcript.log 2>&1
          status=$?
          set -e
          echo "REAL_MINIMAL_AGENT_EXIT_CODE=$status"
          if [ "$status" -ne 0 ]; then tail -c 1400 ../lean-evidence/agent-transcript.log || true; exit "$status"; fi
          python3 - <<'PY'
          import ast,hashlib,json,pathlib,os
          file=pathlib.Path('calc_gate.py')
          assert file.is_file(),'HERMES_DID_NOT_CREATE_FILE'
          src=file.read_text()
          tree=ast.parse(src)
          assert len(tree.body)==1 and isinstance(tree.body[0],ast.FunctionDef)
          fn=tree.body[0]
          assert fn.name=='add' and len(fn.args.args)==2 and len(fn.body)==1
          assert not fn.decorator_list and not fn.args.defaults
          val=fn.body[0]
          assert isinstance(val,ast.Return)
          exp=val.value
          assert isinstance(exp,ast.BinOp) and isinstance(exp.op,ast.Add)
          assert isinstance(exp.left,ast.Name) and isinstance(exp.right,ast.Name)
          assert [exp.left.id,exp.right.id]==[a.arg for a in fn.args.args]
          pathlib.Path('../lean-evidence/receipt.json').write_text(json.dumps({
              'generated_source_verified':True,'source_sha256':hashlib.sha256(src.encode()).hexdigest(),
              'run_id':os.environ['GITHUB_RUN_ID'],'synthetic_scope_only':True,
              'aws_auth':False,'production_worker':False},indent=2))
          print('MINIMAL_REAL_HERMES_CODE_GENERATION=PASS')
          PY
      - name: Preserve limited evidence for independent readback
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hermes-cloud-synthetic-receipt
          path: |
            lean-evidence/
            lean-workspace/calc_gate.py
          if-no-files-found: ignore
          retention-days: 3
      - name: Destroy disposable model runtime
        if: always()
        shell: bash
        run: docker rm -f angels-hermes-ollama >/dev/null 2>&1 || true
