# One-shot, synthetic Hermes Agent verification. Public runner, no ANGELS secrets or authority.
# No scheduled repeat and no deployments. All computation remains on disposable runner.
name: ANGELS Hermes Handoff Recovery Development
on:
  push:
    branches: [lab/hermes-handoff-recovery-20261009]
    paths: [.github/workflows/angels-hermes-handoff-recovery.yml]
permissions: {}
concurrency:
  group: angels-hermes-handoff-recovery
  cancel-in-progress: false

jobs:
  real-hermes-free-inference:
    if: github.repository == 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Assert no company source and no production authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REPOSITORY" = "visionastro48-dev/shaddow-synthetic-host-gate-20261001"
          test ! -e .git
          test ! -e "$HOME/.hermes"
          test ! -e /srv/angels-foundation-v1
          echo 'ISOLATED_STANDARD_PUBLIC_RUNNER=true'
          echo 'PRODUCTION_AUTHORITY=false'
          echo 'GITHUB_REPOSITORY_SOURCE_CHECKED_OUT=false'

      - name: Install upstream Hermes in disposable runner home
        shell: bash
        timeout-minutes: 18
        run: |
          set -Eeuo pipefail
          export HOME="$RUNNER_TEMP/hermes-user"
          export HERMES_HOME="$HOME/.hermes"
          mkdir -p "$HOME"
          curl -fsSL --retry 2 --connect-timeout 15 https://hermes-agent.nousresearch.com/install.sh -o "$RUNNER_TEMP/hermes-install.sh"
          bash "$RUNNER_TEMP/hermes-install.sh" --non-interactive --skip-browser --skip-computer-use --hermes-home "$HERMES_HOME" --dir "$HERMES_HOME/hermes-agent"
          export PATH="$HOME/.local/bin:$HERMES_HOME/bin:$PATH"
          command -v hermes || test -x "$HERMES_HOME/bin/hermes"
          echo 'OFFICIAL_HERMES_INSTALLED_IN_DISPOSABLE_HOME=true'
          echo "HERMES_HOME=$HERMES_HOME" >> "$GITHUB_ENV"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HERMES_HOME/bin" >> "$GITHUB_PATH"

      - name: Execute one bounded real Hermes model and independently verify artifact
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$HERMES_HOME/bin:$PATH"
          hermes --help >/dev/null
          # Temporary loopback relay: Kilo accepts the verified free model without a token,
          # but Hermes sends a placeholder Authorization header that Kilo rejects.
          curl -fsSL --retry 2 --connect-timeout 10 \
            https://raw.githubusercontent.com/visionastro48-dev/shaddow-synthetic-host-gate-20261001/e2f4b8fe20e81af0a4172600417c03a9bec147b4/angels-recovery/hermes-free-noauth-proxy.py \
            -o "$RUNNER_TEMP/hermes-free-proxy.py"
          python3 -u "$RUNNER_TEMP/hermes-free-proxy.py" > "$RUNNER_TEMP/hermes-proxy.log" 2>&1 &
          proxy_pid=$!
          trap 'kill "$proxy_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 15); do
            if curl -fsS --max-time 1 http://127.0.0.1:8765/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1
          echo 'CREDENTIALLESS_FREE_PROXY_LISTENING_LOCALHOST=true'
          mkdir -p "$HERMES_HOME" "$RUNNER_TEMP/hermes-workspace"
          chmod 700 "$HERMES_HOME"
          printf '%s\n'             'model:'             '  default: "nvidia/nemotron-3.5-lightning:free"'             '  provider: custom'             '  base_url: "http://127.0.0.1:8765/v1"'             '  api_key: ""'             'fallback_providers: []'             'terminal:'             '  backend: local'             > "$HERMES_HOME/config.yaml"
          chmod 600 "$HERMES_HOME/config.yaml"
          cat > "$RUNNER_TEMP/hermes-task.txt" <<'HERMES_MISSION'
          ANGELS task HERMES-HANDOFF-GATE-002. You are coding an offline input validation utility in a disposable folder. Write the actual Python file. No production access.
          Create exactly one file, handoff_gate.py, containing function validate_mission(mission, stopped_projects=()).
          This should take a dictionary with exactly these seven keys:
          schema, mission_id, project_id, agent_id, job_type, task, authority.
          Reject invalid inputs by raising ValueError:
          - schema must equal angels.agent-mission/v1
          - job_type must equal isolated-coding
          - authority must equal no-production-authority
          - IDs must be ASCII alphanumeric, underscore or hyphen, length 3..80
          - task must be a string length 5..8000 and not whitespace-only
          - project_id cannot appear in stopped_projects
          On valid input return {'decision': 'ALLOW_SANDBOX', 'mission_id': mission['mission_id']}.
          Use the terminal tool to write the file with a heredoc, then compile using python3 -m py_compile handoff_gate.py. Do not just say you created it.
          HERMES_MISSION
          cd "$RUNNER_TEMP/hermes-workspace"
          set +e
          timeout 170 hermes chat --oneshot --quiet --toolsets "terminal,file" --max-turns 8 --provider custom --model "nvidia/nemotron-3.5-lightning:free" --query-file "$RUNNER_TEMP/hermes-task.txt" > "$RUNNER_TEMP/hermes-log.txt" 2>&1
          result=$?
          set -e
          echo "HERMES_EXIT_STATUS=$result"
          sed -n '1,100p' "$RUNNER_TEMP/hermes-log.txt"
          echo 'HERMES_PROXY_RECEIPTS_BEGIN'
          sed -n '1,80p' "$RUNNER_TEMP/hermes-proxy.log"
          echo 'HERMES_PROXY_RECEIPTS_END'
          test "$result" -eq 0
          grep -q '"event": "FREE_INFERENCE_RECEIPT"' "$RUNNER_TEMP/hermes-proxy.log"
          if [ ! -f handoff_gate.py ] || [ -L handoff_gate.py ]; then echo 'HERMES_REAL_HANDOFF_MODULE_ABSENT_OR_SYMLINK=true'; exit 1; fi
          test "$(wc -c < handoff_gate.py)" -gt 200
          python3 -m py_compile handoff_gate.py
          echo 'ACTUAL_HERMES_AUTHORED_CODE_SHA256_BEGIN'
          sha256sum handoff_gate.py
          echo 'ACTUAL_HERMES_AUTHORED_CODE_SHA256_END'
          echo 'ACTUAL_HERMES_SOURCE_BEGIN'
          sed -n '1,200p' handoff_gate.py
          echo 'ACTUAL_HERMES_SOURCE_END'
          python3 - <<'PY'
          import sys
          sys.path.insert(0,'.')
          from handoff_gate import validate_mission
          good={'schema':'angels.agent-mission/v1','mission_id':'task_001','project_id':'angels_test','agent_id':'hermes_code','job_type':'isolated-coding','task':'Implement safe handoff parsing','authority':'no-production-authority'}
          assert validate_mission(good) == {'decision':'ALLOW_SANDBOX','mission_id':'task_001'}
          n = 1
          def rejected(x,stopped=()):
              global n
              try: validate_mission(x, stopped_projects=stopped)
              except ValueError: n += 1; return
              raise AssertionError('unsafe mission accepted')
          rejected({**good,'extra':'unauthorized'})
          rejected({k:v for k,v in good.items() if k!='authority'})
          rejected({**good,'authority':'production-write'})
          rejected({**good,'job_type':'customer-outreach'})
          rejected({**good,'schema':'legacy'})
          rejected({**good,'mission_id':'bad/id'})
          rejected({**good,'project_id':'x'})
          rejected({**good,'agent_id':'a'*81})
          rejected({**good,'task':'   '})
          rejected({**good,'task':'x'*8001})
          rejected(good, ('angels_test',))
          rejected([])
          print('INDEPENDENT_HERMES_HANDOFF_GATE_TESTS_PASSED=',n)
          PY
          echo 'REAL_HERMES_INTEGRATION_DEVELOPMENT_ACCEPTED=true'
          echo 'NO_ANGELS_GATEWAY_ENROLLMENT=true'

      - name: Preserve Hermes development artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-real-handoff-gate
          path: ${{ runner.temp }}/hermes-workspace/handoff_gate.py
          if-no-files-found: ignore
          retention-days: 7

      - name: Retain truth boundary
        if: always()
        shell: bash
        run: |
          echo 'ONE_SHOT_PUBLIC_RUNNER_ONLY=true'
          echo 'CONTINUOUS_24X7=false'
          echo 'ANGELS_PRODUCTION_AUTHORITY=false'
          echo 'PERMANENT_HERMES_INSTALL=false'
