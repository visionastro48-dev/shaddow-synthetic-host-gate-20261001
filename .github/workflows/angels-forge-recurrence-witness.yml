name: ANGELS FORGE Readonly Recurrence Witness
on:
  workflow_dispatch:
  schedule:
    - cron: '58 * * * *'
permissions:
  contents: read
concurrency:
  group: angels-forge-readonly-recurrence
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify scheduled model executions and immutable receipts
        run: |
          set -Eeuo pipefail
          python3 -m py_compile angels-recovery/forge_recurring_witness.py
          python3 angels-recovery/forge_recurring_witness.py
