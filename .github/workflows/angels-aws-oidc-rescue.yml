# ANGELS: new path through the already-working public Actions runner.
# This never uses AWS access keys, Cloudflare auth, SSH or the founder laptop.
name: ANGELS AWS OIDC Readonly Rescue
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/angels-aws-oidc-rescue.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: angels-aws-oidc-rescue
  cancel-in-progress: false
jobs:
  verify-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assert current execution carrier and non-promotion
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
          test "$GITHUB_REF" = 'refs/heads/main'
          echo 'EXISTING_PUBLIC_GITHUB_RUNNER=ACTIVE'
          echo 'AWS_AUTHORIZE=NOT_PROVED_BY_LOCAL_CI'
          echo 'HERMES_PRODUCTION=NOT_CERTIFIED'
          echo 'NO_STATIC_AWS_CREDENTIALS_USED=true'
  aws-ssm-fixed-readonly:
    needs: verify-readiness
    if: ${{ vars.ANGELS_AWS_READONLY_ROLE_ARN != '' && vars.ANGELS_EXISTING_AWS_INSTANCE_ID != '' && vars.ANGELS_READONLY_SSM_DOCUMENT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.ANGELS_AWS_READONLY_ROLE_ARN }}
      ANGELS_EXISTING_AWS_INSTANCE_ID: ${{ vars.ANGELS_EXISTING_AWS_INSTANCE_ID }}
      ANGELS_READONLY_SSM_DOCUMENT: ${{ vars.ANGELS_READONLY_SSM_DOCUMENT }}
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_PAGER: ''
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_MAX_ATTEMPTS: '1'
    steps:
      - name: Exchange ephemeral GitHub OIDC assertion via AWS IAM
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'visionastro48-dev/shaddow-synthetic-host-gate-20261001'
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$AWS_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[a-zA-Z0-9_+=,.@/-]+$ ]] || exit 21
          [[ "$ANGELS_EXISTING_AWS_INSTANCE_ID" =~ ^i-[0-9a-f]{17}$ ]] || exit 22
          [[ "$ANGELS_READONLY_SSM_DOCUMENT" =~ ^ANGELS-[A-Za-z0-9_.-]+$ ]] || exit 23
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          umask 077
          token_file="$(mktemp)"
          echo "AWS_WEB_IDENTITY_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --max-time 20 \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"],end="")' > "$token_file"
          test -s "$token_file"
          aws sts get-caller-identity --query Arn --output text >/dev/null
          echo 'AWS_IAM_OIDC_AUTHENTICATED=TRUE'
      - name: Execute existing EC2 fixed document with no parameters
        shell: bash
        run: |
          set -euo pipefail
          iid="$ANGELS_EXISTING_AWS_INSTANCE_ID"
          state="$(aws ec2 describe-instances --instance-ids "$iid" --query 'Reservations[0].Instances[0].State.Name' --output text)"
          test "$state" = running || { echo 'BLOCKED_EC2_NOT_RUNNING'; exit 24; }
          ping="$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$iid" --query 'InstanceInformationList[0].PingStatus' --output text)"
          test "$ping" = Online || { echo 'BLOCKED_SSM_OFFLINE'; exit 25; }
          cid="$(aws ssm send-command --instance-ids "$iid" --document-name "$ANGELS_READONLY_SSM_DOCUMENT" --comment 'ANGELS fixed read-only Hermes and Ollama probe' --query Command.CommandId --output text)"
          [[ "$cid" =~ ^[a-f0-9-]{36}$ ]] || exit 26
          aws ssm wait command-executed --command-id "$cid" --instance-id "$iid"
          aws ssm get-command-invocation --command-id "$cid" --instance-id "$iid" --output json \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);a=d.get("StandardOutputContent","").splitlines();assert d.get("Status")=="Success" and len(a)==3 and a[0]=="ANGELS_SCOPE=READONLY";assert all(v in ("active","inactive","failed","unknown") for v in a[1:]);print(json.dumps({"status":"AUTHENTICATED_AWS_SSM_READONLY_RECEIPT","hermes_gateway_active":a[1]=="active","ollama_active":a[2]=="active","hermes_production_certified":False}))'
          echo "AWS_SSM_COMMAND_ID=$cid"
      - name: Erase ephemeral OIDC assertion
        if: always()
        shell: bash
        run: |
          if [[ -n "${AWS_WEB_IDENTITY_TOKEN_FILE:-}" ]]; then
            rm -f -- "$AWS_WEB_IDENTITY_TOKEN_FILE"
          fi
